name: Tests
# Browser tests (tests/*.test.mjs): the trip panel's positions and gestures, typing a
# station, the iPhone keyboard handling (simulated), and that the page loads cleanly.
on:
  push:
    branches-ignore: [main]      # main is tested by the deploy workflow, before it deploys
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
