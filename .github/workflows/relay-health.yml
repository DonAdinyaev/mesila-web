name: Relay health
# Checks the live-delays relay (relay/worker.js) every 6 hours: it must answer, and on a
# day with trains it must return them. A failed run means live delays and platforms are
# missing in the app; GitHub emails the repository owner about failed scheduled runs.
on:
  schedule:
    - cron: '17 */6 * * *'       # UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the relay for today's Netanya -> Tel Aviv Savidor trains
        run: |
          day=$(TZ=Asia/Jerusalem date +%F); dow=$(TZ=Asia/Jerusalem date +%u)   # 6 = Saturday
          url="https://mesila-live.mesila.workers.dev/trains?from=3300&to=3700&date=$day"
          code=$(curl -s -o body.json -w '%{http_code}' --max-time 30 --retry 2 --retry-delay 10 "$url" || true)
          echo "HTTP $code from $url"; head -c 400 body.json; echo
          [ "$code" = "200" ] || { echo "::error::the relay answered HTTP $code"; exit 1; }
          n=$(jq '.trains | length' body.json) || { echo "::error::the relay's answer is not the expected JSON"; exit 1; }
          echo "$n trains"
          if [ "$n" -eq 0 ] && [ "$dow" != "6" ]; then echo "::error::no trains returned on a day with service"; exit 1; fi
