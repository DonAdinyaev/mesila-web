name: Update timetable
# Rebuilds data/timetable.js from the Ministry of Transport GTFS feed (Israel Railways
# planned timetable) and redeploys the site when it changed.
on:
  schedule:
    - cron: '17 2 * * 0,3'   # Sunday and Wednesday, 04:17/05:17 Israel time
  workflow_dispatch:
  push:   # also rebuild when the builder or this workflow changes
    paths:
      - tools/build_timetable.py
      - .github/workflows/timetable.yml
permissions:
  contents: write
  actions: write
concurrency:
  group: timetable
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build timetable
        run: python3 tools/build_timetable.py
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- data/timetable.js; then
            echo "Timetable unchanged."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # bust the browser cache for the data file
          v=$(date -u +%Y%m%d)
          sed -i -E "s#data/timetable\.js\?v=[0-9a-z]+#data/timetable.js?v=$v#" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/timetable.js index.html
          git commit -m "Update timetable from GTFS feed ($(date -u +%Y-%m-%d))"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN don't start other workflows, so deploy explicitly
      # (Pages deploys only from main)
      - name: Deploy site
        if: steps.commit.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
