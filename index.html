<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Mesila · Israel Railways</title>
<link rel="icon" type="image/svg+xml" href="assets/mesila-logo.svg" media="(prefers-color-scheme: light)"/>
<link rel="icon" type="image/svg+xml" href="assets/mesila-logo-dark.svg" media="(prefers-color-scheme: dark)"/>
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png"/>
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-title" content="Mesila"/>
<!-- colour of the browser's own bars (iPhone status bar area): the map's land colour, kept in sync with the theme -->
<meta name="theme-color" id="theme-color" content="#FDFCFA"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --font: "Inter", "Heebo", system-ui, sans-serif;
    --map-bg: #F6F4EF;
    --surface: #FFFFFF;
    --chip-bg: #F1EEE6;
    --chip-border: #E6E2D7;
    --text: #1A1A1C;
    --text-dim: #6B6B70;
    --logo-b: #1F2852;
    --land: #FDFCFA; --outside: #F4F2ED; --sea: #EAF2F4; --sea-deep: #D6E5EA; --coast: #DCE8EC; --border: #ECE8E0;
    --sea-ink: #9DB6BF; --geo-ink: #C4BEB2; --region-ink: #EAE6DD; --city-ink: #8A857B;
  }
  [data-theme="dark"] {
    --map-bg: #16171A;
    --surface: #1F2024;
    --chip-bg: #282A2F;
    --chip-border: #34363C;
    --text: #F3F1EC;
    --text-dim: #9A9AA1;
    --logo-b: #5CAEE0;
    --land: #1C1D21; --outside: #17181B; --sea: #181E22; --sea-deep: #1F2B31; --coast: #1F2B31; --border: #25272B;
    --sea-ink: #4F6A75; --geo-ink: #46484D; --region-ink: #26282C; --city-ink: #7D7B76;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               font-family: var(--font);
               background: var(--land); color: var(--text); }
  /* Edge to edge: iOS 26 Safari draws ordinary page content behind its status bar and
     bottom toolbar, but clips position:fixed layers to the area between them. So the
     app is an absolute (not fixed) layer as tall as the whole screen (100lvh); the top
     controls sit below env(safe-area-inset-top), and the bottom sheet pads its content
     by --below-ui (the part the toolbar covers) plus the home-indicator inset, while its
     background still reaches the screen edge. Older browsers: 100vh and 0. */
  :root { --below-ui: 0px; }
  @supports (height: 100lvh) { :root { --below-ui: calc(100lvh - 100dvh); } }
  #root { position: absolute; left: 0; right: 0; top: 0; height: 100vh; height: 100lvh; }
  /* Phone: the map is the page and scrolls natively (iOS momentum and bounce, and Safari
     draws the scrolled map behind its status bar and toolbar); the controls are fixed
     overlays on top of it. */
  html.page-scroll, html.page-scroll body { height: auto; overflow-x: hidden; overflow-y: auto; }
  html.page-scroll #root { position: relative; height: auto; min-height: 100vh; }
  @keyframes mesilaFade { from { opacity: 0; } to { opacity: 1; } }
  /* No text selection anywhere (taps and drags on the map shouldn't highlight); inputs stay editable */
  html, body, * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  @keyframes mesilaPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px);} to { opacity: 1; transform:none; } }
  button:active { transform: scale(0.98); }
  button { transition: transform 80ms, background 120ms, opacity 120ms; }
  input::placeholder { color: var(--text-dim); opacity: 0.7; }
  /* loading screen (inside #root until the app replaces it) */
  :root { --sk-base: #DEDACF; --sk-hi: #FFFFFF; }
  [data-theme="dark"] { --sk-base: #2A2C31; --sk-hi: #3B3E45; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --sk-base: #2A2C31; --sk-hi: #3B3E45; } }
  .loading { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: var(--land); transition: opacity 300ms ease; }
</style>
</head>
<body>
<div id="root"></div>
  <!-- Loading screen: shown while the scripts load, kept for at least 1.5 s, then faded out once the app is up. The logo's rails
       are grey with a light band sweeping across them (a skeleton shimmer). -->
  <div id="loader" class="loading" aria-label="Mesila" role="img">
    <svg width="96" height="98" viewBox="36 30 168 172" aria-hidden="true">
      <defs>
        <linearGradient id="sk" gradientUnits="userSpaceOnUse" x1="-120" y1="0" x2="0" y2="0">
          <stop offset="0" style="stop-color:var(--sk-base)"/><stop offset="0.5" style="stop-color:var(--sk-hi)"/><stop offset="1" style="stop-color:var(--sk-base)"/>
          <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="360 0" dur="1.4s" repeatCount="indefinite"/>
        </linearGradient>
      </defs>
      <g fill="none" stroke="url(#sk)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
        <path d="M52.0 56.0 L82.3 86.3 Q94 98 94.0 114.6 L94 186"/>
        <path d="M68.0 186.0 L68.0 166.6 Q68 150 79.7 138.3 L102.3 115.7 Q114 104 114.0 87.4 L114.0 75.0 Q114 46 143.0 46.0 L151.0 46.0 Q188 46 188.0 83.0 L188.0 163.0 Q188 186 165.0 186.0 L142 186"/>
      </g>
      <g fill="url(#sk)"><circle cx="52" cy="56" r="14"/><circle cx="68" cy="186" r="14"/><circle cx="94" cy="186" r="14"/><circle cx="142" cy="186" r="14"/></g>
    </svg>
  </div>

<script>window.safeTop = () => { const p = document.getElementById('sat-probe'); return p ? p.offsetHeight : 0; };</script>
<!-- measures env(safe-area-inset-top) for code that positions things below the status bar -->
<div id="sat-probe" aria-hidden="true" style="position:absolute;top:0;left:0;width:0;height:env(safe-area-inset-top,0px);visibility:hidden;pointer-events:none"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data/network.js?v=57"></script>
<script src="data/i18n.js?v=20"></script>
<script src="data/timetable.js?v=20261118"></script>
<script src="data/schedule.js?v=7"></script>
<script src="data/live.js?v=2"></script>
<script type="text/babel" src="components/MapSVG.js?v=106"></script>
<script type="text/babel" src="components/Sheet.js?v=70"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "labelDensity": "normal",
  "fontEn": "Inter",
  "fontHe": "Assistant"
}/*EDITMODE-END*/;

// Font choices (Google Fonts) with the weights each family actually offers
const FONTS_EN = {
  'Inter':'400;500;600;700;800', 'Roboto':'400;500;700', 'IBM Plex Sans':'400;500;600;700',
  'Work Sans':'400;500;600;700;800', 'Manrope':'400;500;600;700;800', 'DM Sans':'400;500;600;700;800',
  'Source Sans 3':'400;500;600;700;800', 'Nunito Sans':'400;600;700;800', 'Montserrat':'400;500;600;700;800',
};
const FONTS_HE = {
  'Heebo':'400;500;600;700;800', 'Assistant':'400;500;600;700;800', 'Rubik':'400;500;600;700;800',
  'Noto Sans Hebrew':'400;500;600;700;800', 'IBM Plex Sans Hebrew':'400;500;600;700', 'Open Sans':'400;500;600;700;800',
  'Frank Ruhl Libre':'400;500;600;700;800', 'Alef':'400;700', 'Varela Round':'400', 'Secular One':'400',
};
const fontUrl = (fams) => 'https://fonts.googleapis.com/css2?' + fams.map(([n, w]) =>
  'family=' + n.replace(/ /g, '+') + (w.includes(';') ? ':wght@' + w : '')).join('&') + '&display=swap';

const { LINES: ALL_LINES } = window.MESILA;

// Language switch: a lone button at the top corner where the old top bar's switch sat
// (right in English, left in Hebrew), level with the hint pill
function LangButton({ lang, onToggleLang }) {
  const T = window.I18N;
  return (
    <button onClick={onToggleLang} title={T.t('langTitle')} aria-label={T.t('langTitle')} lang={lang === 'he' ? 'en' : 'he'}
      style={{ position: 'fixed', top: 'calc(env(safe-area-inset-top, 0px) + 12px)', insetInlineEnd: 12, zIndex: 7,
        minWidth: 40, height: 40, padding: '0 10px', borderRadius: 14, cursor: 'pointer',
        background: 'var(--surface)', border: '1px solid var(--chip-border)', boxShadow: '0 4px 12px rgba(0,0,0,0.08)',
        color: 'var(--text)', font: '600 14px var(--font)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
      {T.t('langBtn')}
    </button>
  );
}

function TweaksPanel({ tweaks, setTweaks, onClose }) {
  const T = window.I18N;
  const set = (k, v) => setTweaks({ ...tweaks, [k]: v });
  return (
    <div style={{
      position:'fixed', right: 12, bottom: 12,
      zIndex: 20, width: 280,
      background: 'var(--surface)', borderRadius: 16,
      border: '1px solid var(--chip-border)',
      boxShadow: '0 12px 28px rgba(0,0,0,0.16)',
      padding: 12,
      font: '500 13px var(--font)',
    }}>
      <div style={{ display:'flex', alignItems:'center', marginBottom: 10 }}>
        <div style={{ font:'700 13px var(--font)', color:'var(--text)' }}>{T.t('tweaks')}</div>
        <button onClick={onClose} style={{
          marginInlineStart:'auto', border:'none', background:'transparent',
          cursor:'pointer', color:'var(--text-dim)', fontSize: 16,
        }}>×</button>
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap: 10 }}>
        <label style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <span style={{ color:'var(--text)' }}>{T.t('theme')}</span>
          <select value={tweaks.theme} onChange={e=>set('theme', e.target.value)}
            style={{ border:'1px solid var(--chip-border)', borderRadius:8, padding:'4px 8px', background:'var(--chip-bg)', color:'var(--text)' }}>
            <option value="light">{T.t('light')}</option>
            <option value="dark">{T.t('dark')}</option>
          </select>
        </label>
        <label style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <span style={{ color:'var(--text)' }}>{T.t('density')}</span>
          <select value={tweaks.labelDensity} onChange={e=>set('labelDensity', e.target.value)}
            style={{ border:'1px solid var(--chip-border)', borderRadius:8, padding:'4px 8px', background:'var(--chip-bg)', color:'var(--text)' }}>
            <option value="sparse">{T.t('sparse')}</option>
            <option value="normal">{T.t('normal')}</option>
            <option value="dense">{T.t('dense')}</option>
          </select>
        </label>
        <label style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap: 8 }}>
          <span style={{ color:'var(--text)' }}>{T.t('fontEn')}</span>
          <select value={tweaks.fontEn} onChange={e=>set('fontEn', e.target.value)}
            style={{ border:'1px solid var(--chip-border)', borderRadius:8, padding:'4px 8px', background:'var(--chip-bg)', color:'var(--text)', maxWidth: 130 }}>
            {Object.keys(FONTS_EN).map(f => <option key={f} value={f} style={{ fontFamily: f }}>{f}</option>)}
          </select>
        </label>
        <label style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap: 8 }}>
          <span style={{ color:'var(--text)' }}>{T.t('fontHe')}</span>
          <select value={tweaks.fontHe} onChange={e=>set('fontHe', e.target.value)}
            style={{ border:'1px solid var(--chip-border)', borderRadius:8, padding:'4px 8px', background:'var(--chip-bg)', color:'var(--text)', maxWidth: 130 }}>
            {Object.keys(FONTS_HE).map(f => <option key={f} value={f} style={{ fontFamily: f }}>{f}</option>)}
          </select>
        </label>
      </div>
    </div>
  );
}

function App() {
  const T = window.I18N;
  const [lang, setLang] = React.useState(T.lang);
  // Phones get the vertical-scroll map: no zoom buttons there
  const [narrow, setNarrow] = React.useState(window.innerWidth < 600);
  // phone layout: the page itself scrolls the map
  React.useEffect(() => { document.documentElement.classList.toggle('page-scroll', narrow); }, [narrow]);
  React.useEffect(() => { try { history.scrollRestoration = 'manual'; } catch (e) {} }, []);
  React.useEffect(() => { const f = () => setNarrow(window.innerWidth < 600); window.addEventListener('resize', f); return () => window.removeEventListener('resize', f); }, []);
  React.useEffect(() => {
    T.setLang(lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = T.dir;
    document.title = lang === 'he' ? 'מסילה · רכבת ישראל' : 'Mesila · Israel Railways'; // same as the header
  }, [lang]);
  // Switch the shared language first so every component renders with it on this pass
  const toggleLang = () => { const next = lang === 'he' ? 'en' : 'he'; T.setLang(next); setLang(next); };
  const [from, setFrom] = React.useState(null);
  // Nearest station: asked once when the app opens (if From is still empty), and
  // again from the locate button. Only stations within 25 km count, so a viewer
  // abroad gets nothing filled in. `located` = { id, km } of the last result.
  const [located, setLocated] = React.useState(null);
  const [locating, setLocating] = React.useState(false);
  const fromRef = React.useRef(null); fromRef.current = from;
  // Live position for the map's "you are here" dot: { lat, lon, acc (m) }
  const [here, setHere] = React.useState(null);
  const [centerTick, setCenterTick] = React.useState(0);   // bump: scroll the map to the dot
  // On opening, the first location fix scrolls the map to the dot once (the map skips
  // it if the user has already moved the map meanwhile)
  const [openCenter, setOpenCenter] = React.useState(0), openCentred = React.useRef(false);
  const firstFix = () => { if (!openCentred.current) { openCentred.current = true; setOpenCenter(1); } };
  const toHere = (pos) => ({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy || 0 });
  const hereRef = React.useRef(null); hereRef.current = here;
  const locate = React.useCallback((manual) => {
    if (!navigator.geolocation || !window.SCHEDULE || !window.SCHEDULE.nearest) return;
    const useFix = (h, setFromIt) => {
      const n = window.SCHEDULE.nearest(h.lat, h.lon);
      if (!n || n.km > 25) return;
      setLocated(n);
      if (setFromIt) setFrom(n.id);
    };
    // A tap acts at once with the position we already have (scroll to the dot, fill
    // From); a fresh fix, which can take seconds, then refines the station and only
    // scrolls if there was nothing to scroll to before.
    let centred = false;
    if (manual && hereRef.current) { useFix(hereRef.current, true); setCenterTick(t => t + 1); centred = true; }
    setLocating(true);
    navigator.geolocation.getCurrentPosition((pos) => {
      setLocating(false);
      const h = toHere(pos); setHere(h);
      if (manual && !centred) setCenterTick(t => t + 1);
      if (!manual) firstFix();
      // on open, don't overwrite a station the user picked meanwhile
      useFix(h, manual || !fromRef.current);
    }, () => setLocating(false),
    // on open a recent fix is fine; a tap on the button asks for a fresh one
    { enableHighAccuracy: !!manual, timeout: 10000, maximumAge: manual ? 0 : 5 * 60000 });
  }, []);
  React.useEffect(() => {
    locate(false);
    // keep the map dot following the user (only once location is allowed)
    if (!navigator.geolocation) return;
    const id = navigator.geolocation.watchPosition((pos) => { setHere(toHere(pos)); firstFix(); }, () => {},
      { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 });
    return () => navigator.geolocation.clearWatch(id);
  }, []);
  const [to, setTo] = React.useState(null);
  const [popup, setPopup] = React.useState(null);
  const [expanded, setExpanded] = React.useState(false);
  // every line is always shown and used for planning (the line filter was removed)
  const lineFilter = React.useMemo(() => new Set(ALL_LINES.map(l => l.id)), []);
  const [focusTick, setFocusTick] = React.useState(0);
  const [zoomCmd, setZoomCmd] = React.useState({ n: 0, dir: 0 });
  const zoom = (dir) => setZoomCmd(z => ({ n: z.n + 1, dir }));

  // Tweaks
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  // Fonts: load the chosen families, then set the stack (current language's font first)
  const [fontKey, setFontKey] = React.useState(0);
  React.useEffect(() => {
    const en = FONTS_EN[tweaks.fontEn] ? tweaks.fontEn : 'Inter', heF = FONTS_HE[tweaks.fontHe] ? tweaks.fontHe : 'Heebo';
    let link = document.getElementById('dyn-fonts');
    if (!link) { link = document.createElement('link'); link.id = 'dyn-fonts'; link.rel = 'stylesheet'; document.head.appendChild(link); }
    link.href = fontUrl([[en, FONTS_EN[en]], [heF, FONTS_HE[heF]]]);
    const stack = lang === 'he' ? `"${heF}", "${en}", system-ui, sans-serif` : `"${en}", "${heF}", system-ui, sans-serif`;
    document.documentElement.style.setProperty('--font', stack);
    window.__fontStack = stack;
    setFontKey(k => k + 1);
    // re-measure map labels once the new fonts have arrived
    Promise.all([document.fonts.load(`500 16px "${en}"`), document.fonts.load(`500 16px "${heF}"`, 'א')])
      .catch(() => {}).then(() => setFontKey(k => k + 1));
  }, [tweaks.fontEn, tweaks.fontHe, lang]);

  React.useEffect(() => {
    document.documentElement.dataset.theme = tweaks.theme;
    { const m = document.getElementById('theme-color'); if (m) m.setAttribute('content', tweaks.theme === 'dark' ? '#1C1D21' : '#FDFCFA'); }
  }, [tweaks.theme]);

  // Edit-mode hook
  React.useEffect(() => {
    const onMsg = (e) => {
      const d = e.data;
      if (!d) return;
      if (d.type === '__activate_edit_mode') setTweaksOpen(true);
      if (d.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  React.useEffect(() => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: tweaks }, '*');
  }, [tweaks]);

  const pickStation = (id) => {
    // Smart behavior: if no from -> set from; else if no to -> set to; else show popup
    if (!from) setFrom(id);
    else if (!to && id !== from) setTo(id);
    else setPopup(id);
  };

  // Trip planning: real planned timetable when loaded (window.SCHEDULE), else the
  // distance-based route. `when` is null for "now", or an Israel wall-clock {day, min}.
  const [when, setWhen] = React.useState(null);
  const [, setTick] = React.useState(0); // re-plan "now" as the minutes pass
  React.useEffect(() => { const t = setInterval(() => setTick(c => c + 1), 30000); return () => clearInterval(t); }, []);
  const nowKey = when ? 0 : Math.floor(Date.now() / 60000);
  // Trips around the requested time, ordered by departure; the sheet swipes between them.
  const trips = React.useMemo(() => {
    if (!window.SCHEDULE || !from || !to || from === to) return { list: [], index: 0 };
    return window.SCHEDULE.alternatives(from, to, lineFilter, when || undefined);
  }, [from, to, lineFilter, when, nowKey]);
  // The chosen trip, kept by identity across the minute re-plan; a new search resets it.
  const tripKey = (j) => j.legs.map(l => l.train + '@' + l.depart).join(',');
  const [selKey, setSelKey] = React.useState(null);
  React.useEffect(() => { setSelKey(null); }, [from, to, when, lineFilter]);
  let selIdx = trips.list.findIndex(j => tripKey(j) === selKey);
  if (selIdx < 0) selIdx = trips.index;
  const journey = trips.list[selIdx] || null;
  const selectTrip = (i) => { const j = trips.list[i]; if (j) setSelKey(tripKey(j)); };
  // Map highlight; kept as the same object while its stations and lines don't change,
  // so the minute tick doesn't re-zoom the map or re-open the sheet.
  const routeRaw = !from || !to || from === to ? null
    : window.SCHEDULE ? window.SCHEDULE.toPath(journey, lineFilter) : window.findRoute(from, to, lineFilter);
  const routeKey = routeRaw ? routeRaw.map(r => r.id + ':' + r.line).join(',') : '';
  const route = React.useMemo(() => routeRaw, [routeKey]);

  // Once both stations are chosen, fold the sheet down to the trip card so the route
  // shows on the map. Changing the time or the trip leaves it as the user left it.
  React.useEffect(() => {
    if (from && to && from !== to) setExpanded(false);
  }, [from, to]);

  const onSwap = () => { setFrom(to); setTo(from); };

  return (
    <div style={narrow ? { position:'relative' } : { position:'absolute', inset: 0 }} data-screen-label="Mesila Map">
      <LangButton lang={lang} onToggleLang={toggleLang}/>

      <div style={narrow ? { position:'relative' } : { position:'absolute', inset: 0 }}>
        <window.MapSVG
          route={route}
          from={from}
          to={to}
          onPickStation={pickStation}
          visibleLines={lineFilter} here={here} centerHereTick={centerTick} openCenterTick={openCenter}
          focusTick={focusTick}
          zoomCmd={zoomCmd}
          density={tweaks.labelDensity}
          lang={lang}
          fontKey={fontKey}
        />
      </div>

      <div style={{ position:'fixed', right: 12, top: 'calc(env(safe-area-inset-top, 0px) + 60px)', zIndex: 4, display:'flex', flexDirection:'column', gap: 8 }}>
        {!narrow && (
        <div style={{ display:'flex', flexDirection:'column', background:'var(--surface)', border:'1px solid var(--chip-border)', borderRadius: 14, boxShadow:'0 4px 12px rgba(0,0,0,0.08)', overflow:'hidden' }}>
          <button onClick={() => zoom(1)} title={T.t('zoomIn')} aria-label={T.t('zoomIn')} style={{ width: 40, height: 40, border:'none', background:'transparent', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'var(--text)' }}>
            <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
          </button>
          <div style={{ height: 1, background:'var(--chip-border)', margin:'0 8px' }}></div>
          <button onClick={() => zoom(-1)} title={T.t('zoomOut')} aria-label={T.t('zoomOut')} style={{ width: 40, height: 40, border:'none', background:'transparent', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'var(--text)' }}>
            <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8h10" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
          </button>
        </div>
        )}
        <button onClick={() => setFocusTick(t=>t+1)} title={T.t(route ? 'showTrip' : here ? 'showMe' : narrow ? 'showTelAviv' : 'whole')} aria-label={T.t(route ? 'showTrip' : here ? 'showMe' : narrow ? 'showTelAviv' : 'whole')} style={{ width: 40, height: 40, borderRadius: 14, background:'var(--surface)', border:'1px solid var(--chip-border)', boxShadow:'0 4px 12px rgba(0,0,0,0.08)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'var(--text)' }}>
          {/* location arrow */}
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20.6 3.4 3.9 10.6c-.8.4-.7 1.6.2 1.8l6.6 1.1 1.1 6.6c.2.9 1.4 1 1.8.2l7.2-16.7c.3-.8-.4-1.5-1.2-1.2z" fill="currentColor"/>
          </svg>
        </button>
      </div>


      <window.StationPopup
        stationId={popup}
        onClose={() => setPopup(null)}
        onSetFrom={setFrom}
        onSetTo={setTo}
      />

      <window.BottomSheet
        from={from} to={to}
        onSetFrom={setFrom} onSetTo={setTo}
        located={located} locating={locating} onLocate={() => locate(true)}
        onSwap={onSwap}
        route={route}
        journey={journey} when={when} setWhen={setWhen}
        trips={trips.list} tripIndex={selIdx} onSelectTrip={selectTrip}
        expanded={expanded}
        setExpanded={setExpanded}
      />

      {tweaksOpen && (
        <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} onClose={()=>setTweaksOpen(false)}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

// Loading screen: shown for at least 1.5 s from the start of the page load, then it
// fades out over the app (which has rendered behind it by then)
(() => {
  const el = document.getElementById('loader'); if (!el) return;
  setTimeout(() => {
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 320);
  }, Math.max(0, 1500 - performance.now()));
})();
</script>
</body>
</html>
