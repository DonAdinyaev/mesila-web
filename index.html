<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Mesila Rail Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --font: "Inter", "Heebo", system-ui, sans-serif;
    --map-bg: #F6F4EF;
    --surface: #FFFFFF;
    --chip-bg: #F1EEE6;
    --chip-border: #E6E2D7;
    --text: #1A1A1C;
    --text-dim: #6B6B70;
    --logo-b: #1F2852;
    --land: #FDFCFA; --outside: #F4F2ED; --sea: #EAF2F4; --sea-deep: #D6E5EA; --coast: #DCE8EC; --border: #ECE8E0;
    --sea-ink: #9DB6BF; --geo-ink: #C4BEB2; --region-ink: #EAE6DD; --city-ink: #8A857B;
  }
  [data-theme="dark"] {
    --map-bg: #16171A;
    --surface: #1F2024;
    --chip-bg: #282A2F;
    --chip-border: #34363C;
    --text: #F3F1EC;
    --text-dim: #9A9AA1;
    --logo-b: #5CAEE0;
    --land: #1C1D21; --outside: #17181B; --sea: #181E22; --sea-deep: #1F2B31; --coast: #1F2B31; --border: #25272B;
    --sea-ink: #4F6A75; --geo-ink: #46484D; --region-ink: #26282C; --city-ink: #7D7B76;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden;
               font-family: var(--font);
               background: var(--outside); color: var(--text); }
  #root { position: absolute; inset: 0; }
  /* No text selection anywhere (taps and drags on the map shouldn't highlight); inputs stay editable */
  html, body, * { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  input, textarea { -webkit-user-select: text; user-select: text; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px);} to { opacity: 1; transform:none; } }
  button:active { transform: scale(0.98); }
  button { transition: transform 80ms, background 120ms, opacity 120ms; }
  input::placeholder { color: var(--text-dim); opacity: 0.7; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data/network.js?v=55"></script>
<script src="data/i18n.js?v=3"></script>
<script src="data/timetable.js?v=1"></script>
<script src="data/schedule.js?v=1"></script>
<script type="text/babel" src="components/MapSVG.js?v=79"></script>
<script type="text/babel" src="components/Sheet.js?v=29"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "light",
  "showNight": false,
  "labelDensity": "normal",
  "fontEn": "Inter",
  "fontHe": "Assistant"
}/*EDITMODE-END*/;

// Font choices (Google Fonts) with the weights each family actually offers
const FONTS_EN = {
  'Inter':'400;500;600;700;800', 'Roboto':'400;500;700', 'IBM Plex Sans':'400;500;600;700',
  'Work Sans':'400;500;600;700;800', 'Manrope':'400;500;600;700;800', 'DM Sans':'400;500;600;700;800',
  'Source Sans 3':'400;500;600;700;800', 'Nunito Sans':'400;600;700;800', 'Montserrat':'400;500;600;700;800',
};
const FONTS_HE = {
  'Heebo':'400;500;600;700;800', 'Assistant':'400;500;600;700;800', 'Rubik':'400;500;600;700;800',
  'Noto Sans Hebrew':'400;500;600;700;800', 'IBM Plex Sans Hebrew':'400;500;600;700', 'Open Sans':'400;500;600;700;800',
  'Frank Ruhl Libre':'400;500;600;700;800', 'Alef':'400;700', 'Varela Round':'400', 'Secular One':'400',
};
const fontUrl = (fams) => 'https://fonts.googleapis.com/css2?' + fams.map(([n, w]) =>
  'family=' + n.replace(/ /g, '+') + (w.includes(';') ? ':wght@' + w : '')).join('&') + '&display=swap';

const { LINES: ALL_LINES } = window.MESILA;

function Header({ onClear, theme, lineFilter, setLineFilter, filterOpen, setFilterOpen, lang, onToggleLang }) {
  const T = window.I18N;
  return (
    <div style={{
      position: 'absolute', top: 0, left: 0, right: 0,
      padding: '12px 12px 0',
      zIndex: 7,
      pointerEvents: 'none',
    }}>
      <div style={{
        pointerEvents: 'auto',
        display:'flex', alignItems:'center', gap: 8,
        background: 'var(--surface)', borderRadius: 16,
        boxShadow: '0 4px 16px rgba(0,0,0,0.08)',
        padding: '8px 10px 8px 14px',
        border: '1px solid var(--chip-border)',
      }}>
        <div style={{
          display:'flex', alignItems:'center', gap: 8,
          font:'700 17px var(--font)', letterSpacing:'-0.02em',
          color: 'var(--text)',
        }}>
          {/* Mesila logo: the letter מ drawn as two rail lines */}
          <svg width="27" height="28" viewBox="36 30 168 172" aria-hidden="true"><path d="M52.0 56.0 L82.3 86.3 Q94 98 94.0 114.6 L94 186" fill="none" stroke="var(--surface)" strokeWidth="25" strokeLinecap="round" strokeLinejoin="round"/><path d="M52.0 56.0 L82.3 86.3 Q94 98 94.0 114.6 L94 186" fill="none" stroke="#E3262D" strokeWidth="18" strokeLinecap="round" strokeLinejoin="round"/><path d="M68.0 186.0 L68.0 166.6 Q68 150 79.7 138.3 L102.3 115.7 Q114 104 114.0 87.4 L114.0 75.0 Q114 46 143.0 46.0 L151.0 46.0 Q188 46 188.0 83.0 L188.0 163.0 Q188 186 165.0 186.0 L142 186" fill="none" stroke="var(--surface)" strokeWidth="25" strokeLinecap="round" strokeLinejoin="round"/><path d="M68.0 186.0 L68.0 166.6 Q68 150 79.7 138.3 L102.3 115.7 Q114 104 114.0 87.4 L114.0 75.0 Q114 46 143.0 46.0 L151.0 46.0 Q188 46 188.0 83.0 L188.0 163.0 Q188 186 165.0 186.0 L142 186" fill="none" stroke="var(--logo-b)" strokeWidth="18" strokeLinecap="round" strokeLinejoin="round"/><line x1="68" y1="186" x2="94" y2="186" stroke="var(--surface)" strokeWidth="31" strokeLinecap="round"/><line x1="68" y1="186" x2="94" y2="186" stroke="#1A1A1C" strokeWidth="25" strokeLinecap="round"/><line x1="68" y1="186" x2="94" y2="186" stroke="#fff" strokeWidth="20.5" strokeLinecap="round"/><circle cx="68" cy="186" r="8.6" fill="var(--logo-b)"/><circle cx="94" cy="186" r="8.6" fill="#E3262D"/><line x1="52" y1="56" x2="52" y2="56" stroke="var(--surface)" strokeWidth="31" strokeLinecap="round"/><line x1="52" y1="56" x2="52" y2="56" stroke="#1A1A1C" strokeWidth="25" strokeLinecap="round"/><line x1="52" y1="56" x2="52" y2="56" stroke="#fff" strokeWidth="20.5" strokeLinecap="round"/><circle cx="52" cy="56" r="8.6" fill="#E3262D"/><line x1="142" y1="186" x2="142" y2="186" stroke="var(--surface)" strokeWidth="31" strokeLinecap="round"/><line x1="142" y1="186" x2="142" y2="186" stroke="#1A1A1C" strokeWidth="25" strokeLinecap="round"/><line x1="142" y1="186" x2="142" y2="186" stroke="#fff" strokeWidth="20.5" strokeLinecap="round"/><circle cx="142" cy="186" r="8.6" fill="var(--logo-b)"/></svg>
          {T.t('brand')}
        </div>
        <div style={{
          marginInlineStart: 10, paddingInlineStart: 10,
          borderInlineStart: '1px solid var(--chip-border)',
          font:'500 12px var(--font)', color:'var(--text-dim)',
          flex: 1, minWidth: 0,
        }}>
          {T.t('operator')}
        </div>
        <button
          onClick={onToggleLang}
          title={T.t('langTitle')}
          aria-label={T.t('langTitle')}
          lang={lang === 'he' ? 'en' : 'he'}
          style={{
            border: '1px solid var(--chip-border)', background: 'var(--chip-bg)', color: 'var(--text)',
            minWidth: 34, height: 34, padding: '0 8px', borderRadius: 10, cursor: 'pointer',
            font: '600 13px var(--font)',
            display:'flex', alignItems:'center', justifyContent:'center',
          }}>
          {T.t('langBtn')}
        </button>
        <button
          onClick={() => setFilterOpen(o => !o)}
          title={T.t('filter')}
          aria-label={T.t('filter')}
          style={{
            border: '1px solid var(--chip-border)',
            background: filterOpen ? 'var(--text)' : 'var(--chip-bg)',
            color: filterOpen ? 'var(--surface)' : 'var(--text)',
            width: 34, height: 34, borderRadius: 10,
            cursor: 'pointer',
            display:'flex', alignItems:'center', justifyContent:'center',
          }}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M2 4h12M4 8h8M6 12h4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/>
          </svg>
        </button>
      </div>

      {filterOpen && (
        <div style={{
          pointerEvents:'auto', marginTop: 8,
          background: 'var(--surface)', borderRadius: 16,
          border:'1px solid var(--chip-border)',
          boxShadow:'0 8px 24px rgba(0,0,0,0.1)',
          padding: 10,
          display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap: 6,
          animation:'fadeIn 180ms',
        }}>
          {ALL_LINES.map(l => {
            const on = lineFilter.has(l.id);
            return (
              <button key={l.id}
                onClick={() => {
                  const n = new Set(lineFilter);
                  if (on) n.delete(l.id); else n.add(l.id);
                  setLineFilter(n);
                }}
                style={{
                  display:'flex', alignItems:'center', gap: 8,
                  padding: '6px 10px', borderRadius: 999,
                  border: '1px solid var(--chip-border)',
                  background: on ? 'var(--chip-bg)' : 'transparent',
                  opacity: on ? 1 : 0.45,
                  cursor:'pointer',
                  font:'500 12px var(--font)', color:'var(--text)',
                }}>
                <span style={{ width: 10, height: 10, borderRadius: 10, background: l.color }}/>
                {T.line(l.id)}
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

function TweaksPanel({ tweaks, setTweaks, onClose }) {
  const T = window.I18N;
  const set = (k, v) => setTweaks({ ...tweaks, [k]: v });
  return (
    <div style={{
      position:'absolute', right: 12, bottom: 12,
      zIndex: 20, width: 280,
      background: 'var(--surface)', borderRadius: 16,
      border: '1px solid var(--chip-border)',
      boxShadow: '0 12px 28px rgba(0,0,0,0.16)',
      padding: 12,
      font: '500 13px var(--font)',
    }}>
      <div style={{ display:'flex', alignItems:'center', marginBottom: 10 }}>
        <div style={{ font:'700 13px var(--font)', color:'var(--text)' }}>{T.t('tweaks')}</div>
        <button onClick={onClose} style={{
          marginInlineStart:'auto', border:'none', background:'transparent',
          cursor:'pointer', color:'var(--text-dim)', fontSize: 16,
        }}>×</button>
      </div>
      <div style={{ display:'flex', flexDirection:'column', gap: 10 }}>
        <label style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <span style={{ color:'var(--text)' }}>{T.t('theme')}</span>
          <select value={tweaks.theme} onChange={e=>set('theme', e.target.value)}
            style={{ border:'1px solid var(--chip-border)', borderRadius:8, padding:'4px 8px', background:'var(--chip-bg)', color:'var(--text)' }}>
            <option value="light">{T.t('light')}</option>
            <option value="dark">{T.t('dark')}</option>
          </select>
        </label>
        <label style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <span style={{ color:'var(--text)' }}>{T.t('density')}</span>
          <select value={tweaks.labelDensity} onChange={e=>set('labelDensity', e.target.value)}
            style={{ border:'1px solid var(--chip-border)', borderRadius:8, padding:'4px 8px', background:'var(--chip-bg)', color:'var(--text)' }}>
            <option value="sparse">{T.t('sparse')}</option>
            <option value="normal">{T.t('normal')}</option>
            <option value="dense">{T.t('dense')}</option>
          </select>
        </label>
        <label style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap: 8 }}>
          <span style={{ color:'var(--text)' }}>{T.t('fontEn')}</span>
          <select value={tweaks.fontEn} onChange={e=>set('fontEn', e.target.value)}
            style={{ border:'1px solid var(--chip-border)', borderRadius:8, padding:'4px 8px', background:'var(--chip-bg)', color:'var(--text)', maxWidth: 130 }}>
            {Object.keys(FONTS_EN).map(f => <option key={f} value={f} style={{ fontFamily: f }}>{f}</option>)}
          </select>
        </label>
        <label style={{ display:'flex', justifyContent:'space-between', alignItems:'center', gap: 8 }}>
          <span style={{ color:'var(--text)' }}>{T.t('fontHe')}</span>
          <select value={tweaks.fontHe} onChange={e=>set('fontHe', e.target.value)}
            style={{ border:'1px solid var(--chip-border)', borderRadius:8, padding:'4px 8px', background:'var(--chip-bg)', color:'var(--text)', maxWidth: 130 }}>
            {Object.keys(FONTS_HE).map(f => <option key={f} value={f} style={{ fontFamily: f }}>{f}</option>)}
          </select>
        </label>
        <label style={{ display:'flex', justifyContent:'space-between', alignItems:'center' }}>
          <span style={{ color:'var(--text)' }}>{T.t('night')}</span>
          <input type="checkbox" checked={tweaks.showNight} onChange={e=>set('showNight', e.target.checked)}/>
        </label>
      </div>
    </div>
  );
}

function App() {
  const T = window.I18N;
  const [lang, setLang] = React.useState(T.lang);
  // Phones get the vertical-scroll map: no zoom buttons there
  const [narrow, setNarrow] = React.useState(window.innerWidth < 600);
  React.useEffect(() => { const f = () => setNarrow(window.innerWidth < 600); window.addEventListener('resize', f); return () => window.removeEventListener('resize', f); }, []);
  React.useEffect(() => {
    T.setLang(lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = T.dir;
    document.title = lang === 'he' ? 'מסילה — רכבת ישראל' : 'Mesila Rail Map';
  }, [lang]);
  // Switch the shared language first so every component renders with it on this pass
  const toggleLang = () => { const next = lang === 'he' ? 'en' : 'he'; T.setLang(next); setLang(next); };
  const [from, setFrom] = React.useState(null);
  const [to, setTo] = React.useState(null);
  const [popup, setPopup] = React.useState(null);
  const [expanded, setExpanded] = React.useState(false);
  const [lineFilter, setLineFilter] = React.useState(new Set(ALL_LINES.map(l => l.id)));
  const [filterOpen, setFilterOpen] = React.useState(false);
  const [focusTick, setFocusTick] = React.useState(0);
  const [zoomCmd, setZoomCmd] = React.useState({ n: 0, dir: 0 });
  const zoom = (dir) => setZoomCmd(z => ({ n: z.n + 1, dir }));

  // Tweaks
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  // Fonts: load the chosen families, then set the stack (current language's font first)
  const [fontKey, setFontKey] = React.useState(0);
  React.useEffect(() => {
    const en = FONTS_EN[tweaks.fontEn] ? tweaks.fontEn : 'Inter', heF = FONTS_HE[tweaks.fontHe] ? tweaks.fontHe : 'Heebo';
    let link = document.getElementById('dyn-fonts');
    if (!link) { link = document.createElement('link'); link.id = 'dyn-fonts'; link.rel = 'stylesheet'; document.head.appendChild(link); }
    link.href = fontUrl([[en, FONTS_EN[en]], [heF, FONTS_HE[heF]]]);
    const stack = lang === 'he' ? `"${heF}", "${en}", system-ui, sans-serif` : `"${en}", "${heF}", system-ui, sans-serif`;
    document.documentElement.style.setProperty('--font', stack);
    window.__fontStack = stack;
    setFontKey(k => k + 1);
    // re-measure map labels once the new fonts have arrived
    Promise.all([document.fonts.load(`500 16px "${en}"`), document.fonts.load(`500 16px "${heF}"`, 'א')])
      .catch(() => {}).then(() => setFontKey(k => k + 1));
  }, [tweaks.fontEn, tweaks.fontHe, lang]);

  React.useEffect(() => {
    document.documentElement.dataset.theme = tweaks.theme;
    const lf = new Set(lineFilter);
    if (tweaks.showNight) { lf.add('N1'); lf.add('N2'); } else { lf.delete('N1'); lf.delete('N2'); }
    setLineFilter(lf);
  }, [tweaks.theme, tweaks.showNight]);

  // Edit-mode hook
  React.useEffect(() => {
    const onMsg = (e) => {
      const d = e.data;
      if (!d) return;
      if (d.type === '__activate_edit_mode') setTweaksOpen(true);
      if (d.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  React.useEffect(() => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: tweaks }, '*');
  }, [tweaks]);

  const pickStation = (id) => {
    // Smart behavior: if no from -> set from; else if no to -> set to; else show popup
    if (!from) setFrom(id);
    else if (!to && id !== from) setTo(id);
    else setPopup(id);
  };

  // Trip planning: real planned timetable when loaded (window.SCHEDULE), else the
  // distance-based route. `when` is null for "now", or an Israel wall-clock {day, min}.
  const [when, setWhen] = React.useState(null);
  const [, setTick] = React.useState(0); // re-plan "now" as the minutes pass
  React.useEffect(() => { const t = setInterval(() => setTick(c => c + 1), 30000); return () => clearInterval(t); }, []);
  const nowKey = when ? 0 : Math.floor(Date.now() / 60000);
  const journey = React.useMemo(() => {
    if (!window.SCHEDULE || !from || !to || from === to) return null;
    return window.SCHEDULE.plan(from, to, lineFilter, when || undefined);
  }, [from, to, lineFilter, when, nowKey]);
  // Map highlight; kept as the same object while its stations and lines don't change,
  // so the minute tick doesn't re-zoom the map or re-open the sheet.
  const routeRaw = !from || !to || from === to ? null
    : window.SCHEDULE ? window.SCHEDULE.toPath(journey, lineFilter) : window.findRoute(from, to, lineFilter);
  const routeKey = routeRaw ? routeRaw.map(r => r.id + ':' + r.line).join(',') : '';
  const route = React.useMemo(() => routeRaw, [routeKey]);

  React.useEffect(() => {
    if (route) setExpanded(true);
  }, [route]);

  const onSwap = () => { setFrom(to); setTo(from); };

  return (
    <div style={{ position:'absolute', inset: 0 }} data-screen-label="Mesila Map">
      <Header
        theme={tweaks.theme}
        lineFilter={lineFilter}
        setLineFilter={setLineFilter}
        filterOpen={filterOpen}
        setFilterOpen={setFilterOpen}
        lang={lang}
        onToggleLang={toggleLang}
      />

      <div style={{ position:'absolute', inset: 0 }}>
        <window.MapSVG
          route={route}
          from={from}
          to={to}
          onPickStation={pickStation}
          visibleLines={lineFilter}
          focusTick={focusTick}
          zoomCmd={zoomCmd}
          density={tweaks.labelDensity}
          lang={lang}
          fontKey={fontKey}
        />
      </div>

      <div style={{ position:'absolute', right: 12, top: 68, zIndex: 4, display:'flex', flexDirection:'column', gap: 8 }}>
        {!narrow && (
        <div style={{ display:'flex', flexDirection:'column', background:'var(--surface)', border:'1px solid var(--chip-border)', borderRadius: 14, boxShadow:'0 4px 12px rgba(0,0,0,0.08)', overflow:'hidden' }}>
          <button onClick={() => zoom(1)} title={T.t('zoomIn')} aria-label={T.t('zoomIn')} style={{ width: 40, height: 40, border:'none', background:'transparent', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'var(--text)' }}>
            <svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
          </button>
          <div style={{ height: 1, background:'var(--chip-border)', margin:'0 8px' }}></div>
          <button onClick={() => zoom(-1)} title={T.t('zoomOut')} aria-label={T.t('zoomOut')} style={{ width: 40, height: 40, border:'none', background:'transparent', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'var(--text)' }}>
            <svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8h10" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/></svg>
          </button>
        </div>
        )}
        <button onClick={() => setFocusTick(t=>t+1)} title={T.t('whole')} aria-label={T.t('whole')} style={{ width: 40, height: 40, borderRadius: 14, background:'var(--surface)', border:'1px solid var(--chip-border)', boxShadow:'0 4px 12px rgba(0,0,0,0.08)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', color:'var(--text)' }}>
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M2 6V2h4M12 2h4v4M16 12v4h-4M6 16H2v-4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </button>
      </div>

      {!popup && !filterOpen && (!from || !to) && (
        <div style={{ position:'absolute', left: 12, top: 68, zIndex: 4, maxWidth:'calc(100% - 80px)', whiteSpace:'nowrap', display:'flex', alignItems:'center', gap: 8, padding:'8px 12px', borderRadius: 999, background:'var(--surface)', border:'1px solid var(--chip-border)', boxShadow:'0 4px 12px rgba(0,0,0,0.08)', font:'500 13px var(--font)', color:'var(--text)', animation:'fadeIn 200ms', pointerEvents:'none' }}>
          <span style={{ width: 10, height: 10, borderRadius: 10, flexShrink: 0, background: !from ? '#1A1A1C' : 'transparent', border: !from ? 'none' : '2px solid #1A1A1C' }}></span>
          <span style={{ flexShrink: 0 }}>{!from ? T.t('tapStart') : T.t('tapDest')}</span>
        </div>
      )}

      <window.StationPopup
        stationId={popup}
        onClose={() => setPopup(null)}
        onSetFrom={setFrom}
        onSetTo={setTo}
      />

      <window.BottomSheet
        from={from} to={to}
        onSetFrom={setFrom} onSetTo={setTo}
        onSwap={onSwap}
        route={route}
        journey={journey} when={when} setWhen={setWhen}
        expanded={expanded}
        setExpanded={setExpanded}
      />

      {tweaksOpen && (
        <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} onClose={()=>setTweaksOpen(false)}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
